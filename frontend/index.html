<!doctype html>
<!-- The inline background paints the canvas before the stylesheet lands, so
     it must track --color-bg in styles.css. It is set on <html> rather than
     <body> because html's background is what fills the viewport beyond the
     body box; leaving it stale is invisible in devtools' body styles but
     tints every page. -->
<html lang="en" style="background:#ffffff">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Arus — track mock IDX portfolios with time-weighted performance against the IHSG, risk analytics, and five years of price history."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23084d77'/%3E%3Cpath d='M14 44 L27 21 L37 35 L44 27 L50 43' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='butt' stroke-linejoin='miter'/%3E%3C/svg%3E"
    />
    <title>Arus · IDX Portfolio Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
