# Production overrides. Use WITH the base file, never instead of it:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# The base file is a development config — it bind-mounts the source, runs
# uvicorn with --reload, publishes Postgres on the host, and falls back to
# well-known credentials. Every one of those is wrong on a public box, so this
# file turns each of them off explicitly rather than relying on a second copy
# of the whole stack that would drift.
services:
  db:
    # `!override` REPLACES the base file's ports instead of appending to them.
    # This is the whole reason the tag is here: Compose merges list fields, so
    # a plain `ports:` block leaves the base file's "5432:5432" in place and
    # the database ends up published on every interface — the loopback entry
    # sits alongside it rather than replacing it. Verified by reading
    # `docker compose config`, which showed published=['5432','5432'].
    ports: !override
      - "127.0.0.1:5432:5432"
    environment:
      # `:?` makes COMPOSE ITSELF refuse to start when the variable is unset,
      # instead of silently falling back to the dev password in the base file.
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
      PGDATABASE: ${POSTGRES_DB}

  backend:
    # No --reload, no file watcher, no bind mount: the image ships the code.
    # One worker on purpose — APScheduler runs IN-PROCESS, so a second worker
    # would mean two schedulers racing to write the same bars.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    # `!reset` drops the base file's `./backend:/app` bind mount. A plain
    # `volumes: []` does NOT — Compose appends, so the host directory would
    # stay mounted over the image and the container would run whatever happens
    # to be on the server's disk rather than what was built.
    volumes: !reset []
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?generate one with `openssl rand -hex 32`}
      # Turns on the app-side secret checks in config.py. Belt and braces with
      # the `:?` above: that stops a MISSING key, this stops the published
      # development one being set deliberately.
      APP_ENV: production
      # The scheduler is written against Asia/Jakarta wall-clock time (bars
      # 18:30, quotes 09:00-16:00). python:3.12-slim has no tzdata, so without
      # this ZoneInfo resolution differs from a dev machine.
      TZ: Asia/Jakarta
      # Controls POST /auth/demo. Defaulted rather than `:?` required: an
      # existing .env.prod written before this variable existed should keep
      # deploying, and "on" matches what a public showcase wants.
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      # Outbound email. `:?` rather than a default, unlike DEMO_ENABLED above:
      # verification is mandatory, so a deployment without these does not
      # degrade — every new account is created unusable and every forgotten
      # password is unrecoverable. Failing here names the missing variable;
      # config.py repeats the check for anything that bypasses Compose.
      #
      # SMTP_PASSWORD is a Google App Password (16 characters, needs 2FA on
      # the account). Gmail rejects plain account passwords for SMTP.
      SMTP_USER: ${SMTP_USER:?set SMTP_USER in .env.prod — the Gmail address that sends verification mail}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD in .env.prod — a Google App Password, not the account password}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Arus}
      # Defaults to the origin Caddy already serves, because two variables
      # that must agree are one that will not. Overridable because DOMAIN also
      # accepts ":80" for an IP-only box, where "https://:80" is not a URL —
      # such a deployment must set APP_BASE_URL to its own http://IP.
      APP_BASE_URL: ${APP_BASE_URL:-https://${DOMAIN}}
      WATCHFILES_FORCE_POLLING: "false"
    # Only Caddy talks to the API. Again `!reset` rather than `[]`: without it
    # the base file's "8000:8000" survives the merge and the API answers
    # directly on the host, bypassing Caddy and therefore TLS entirely.
    ports: !reset []
    expose:
      - "8000"

  caddy:
    # Built, not pulled: frontend/Dockerfile compiles the SPA and copies it
    # into the Caddy image. `dist/` is gitignored, so a bind mount would serve
    # an empty directory on a fresh clone — a blank site with nothing in any
    # log to explain it. Building here means the server needs only Docker.
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config stays mounted so it can be edited without rebuilding the image.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Caddy reads this to request a certificate for the right name.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.prod (or use :80 for an IP-only box)}
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
